[package]
name = "steery-adapter-macos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's adapter for macOS: it starts, finds and signals processes, and plans a launchd agent."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", rev = "f6724eccb38acc4ca85189366a5f03ceac7ff26e" }
steery-adapter-common = { path = "../common" }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }

# Its own workspace, so it builds alone.
[workspace]
