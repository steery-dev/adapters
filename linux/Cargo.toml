[package]
name = "steery-adapter-linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's adapter for Linux: it starts, finds and signals processes, and plans a systemd user service."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", rev = "79b4624d640dd1409abb8fb9b1ee72aec2e7e391" }
steery-adapter-common = { path = "../common" }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }

# Its own workspace, so it builds alone.
[workspace]
