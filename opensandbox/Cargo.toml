[package]
name = "steery-adapter-opensandbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's adapter for OpenSandbox: it makes, starts, pauses and deletes hosts, writes files into them and carries a stream to a command inside one."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", rev = "f6724eccb38acc4ca85189366a5f03ceac7ff26e" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

# Its own workspace, so it builds alone.
[workspace]
